# Test workflow (Shepard S1, 2026-08-06). The repo previously had only
# publish-image.yml — docs/SHEPARD_PLAN.md flags a test workflow as a
# hard prerequisite for any later action tier (Phase S3 proper adds
# coverage floors + protected-path checks; this is the minimal start).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
